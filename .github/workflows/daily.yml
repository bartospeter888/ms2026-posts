name: MS 2026 – Daily Match Cards

on:
  schedule:
    # Polling: každých 10 min, 17:00-06:59 UTC (19:00-08:00 SELČ) — zachytí
    # zápas hned po dohrání, ať skončí večer nebo přes půlnoc.
    - cron: '*/10 17-23,0-6 * 6,7 *'
    # Úklid: jednou denně v 13:00 UTC (15:00 SELČ) — vyčistí karty
    # předchozího herního dne, ať jsou na webu vidět dost dlouho na repost.
    - cron: '0 13 * 6,7 *'
  workflow_dispatch:    # manuální spuštění pro testování
    inputs:
      date_override:
        description: 'Přepsat datum (YYYY-MM-DD) — prázdné = automatická detekce herního dne'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download flags (only missing ones)
        working-directory: scripts
        run: python download_flags.py

      - name: Fetch match results
        working-directory: scripts
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
        run: python fetch_matches.py

      - name: Generate index.html
        working-directory: scripts
        run: python generate_page.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ matches.json processed_ids.json
          if git diff --cached --quiet; then
            echo "Nothing to commit — no new finished matches."
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "chore: match card update ${TIMESTAMP} [skip ci]"
            git push
          fi
