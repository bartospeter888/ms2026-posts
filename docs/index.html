<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">

<title>MS 2026 – FPL Addicted Výsledky</title>
<link rel="stylesheet" href="assets/style.css">

<body>
<div class="page-header">
  <h1>⚽ MS 2026 · Výsledky</h1>
  <div class="date-label">12. června 2026</div>
</div>
<div class="match-section">

  <div class="card-wrapper" id="wrapper-537333">
    <div class="card" id="card-537333" data-match-id="537333">

      <!-- Full-bleed photo background -->
      <div class="photo-zone" id="pz-537333">
        <div class="photo-placeholder" id="pp-537333">
          <div class="photo-placeholder-icon">📷</div>
          <div>Klepni pro nahrání fotky</div>
        </div>
        <img class="player-photo" id="pi-537333" draggable="false" alt="">
      </div>

      <!-- Dark gradient overlay -->
      <div class="gradient-overlay"></div>

      <!-- Top logos -->
      <div class="top-logos">
        <img class="logo-wc"  src="assets/logos/wc2026.png"       alt="FIFA WC 2026">
        <img class="logo-fpl" src="assets/logos/fpl_addicted.png"  alt="FPL Addicted">
      </div>

      <!-- Score section -->
      <div class="score-section">

        </div>
        <div class="score-center">
          <span class="score-num">1</span>
          <div class="score-vline"></div>

          <img class="team-flag" src="assets/flags/BA.png" alt="Bosnia-H.">
          <div class="team-name">Bosnia-H.</div>
        </div>
      </div>

    </div><!-- /card -->
  </div><!-- /card-wrapper -->

  <input type="file" accept="image/*" id="file-537333" style="display:none">

  <div class="controls">
    <button class="btn btn-upload" onclick="document.getElementById('file-537333').click()">
      📷 Nahrát fotku
    </button>
    <button class="btn btn-export" id="export-btn-537333" onclick="exportCard('537333')">
      ⬇️ Stáhnout PNG
    </button>
  </div>

  <div class="caption-box">
    <div class="caption-label">Caption ke zkopírování:</div>
    <textarea class="caption-textarea" id="caption-537333">⚽ VÝSLEDEK | CANADA 1:1 BOSNIA-H.
📅 12. června 2026 | Skupina B | Skupinová fáze

  Canada: 78' Cyle Larin

🔮 Sleduj FPL Addicted pro tipy na WC fantasy ligu!

#MS2026 #WorldCup2026 #Canada #Bosnia-H. #FPL #FPLAddicted</textarea>
    <button class="btn-copy" id="copy-btn-537333" onclick="copyCaption('537333')">
      📋 Kopírovat caption
    </button>
  </div>

</div><!-- /match-section -->
<div class="match-divider"></div>
